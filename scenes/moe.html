<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mHC 与 MoE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1320; --panel:#161d2e; --line:#2a3550; --fg:#e6ebf5; --muted:#8d9ab5;
  --token:#ffcf5a; --hbm:#e08a4a; --compute:#8f84ff; --nvlink:#45c6e8; --kv:#5fd3a0; --cpu:#c9d1e0; --idle:#4a5570;
  --sans:"Noto Sans SC",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;line-height:1.3;font-family:var(--mono),"Noto Sans SC",sans-serif;
  color:var(--fg);background:rgba(14,19,32,.78);border:1px solid var(--line);border-radius:4px;padding:2px 6px;transition:opacity .3s}
.lb.t{border-color:var(--token);color:var(--token)} .lb.h{border-color:var(--hbm);color:var(--hbm)}
.lb.c{border-color:var(--compute);color:var(--compute)} .lb.n{border-color:var(--nvlink);color:var(--nvlink)}
.lb.k{border-color:var(--kv);color:var(--kv)} .lb.m{color:var(--muted)}
#panel{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
#cap{font-size:14px;line-height:1.6;max-height:8.6em;overflow-y:auto}
#cap h2{font-size:15px;margin:0 0 2px;font-weight:600}
#cap h2 .no{font-family:var(--mono);color:var(--muted);font-weight:400;margin-right:6px}
#cap code,.mono{font-family:var(--mono),"Noto Sans SC",sans-serif;font-size:12.5px}
#cap code{color:var(--muted)}
#cap b{color:var(--token);font-weight:600}
#cap .h{color:var(--hbm)} #cap .n{color:var(--nvlink)} #cap .c{color:var(--compute)}
#cap .est{color:var(--muted);border:1px dashed var(--idle);border-radius:3px;padding:0 4px;font-size:12px}
#readout{font-family:var(--mono),"Noto Sans SC",sans-serif;font-size:12.5px;color:var(--hbm);min-height:1.2em}
#ctrl{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
#ctrl button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;height:32px;min-width:36px;font:14px var(--mono);cursor:pointer}
#ctrl button:hover{border-color:var(--muted)}
#dots{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
#dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;display:block}
#dots i.on{background:var(--token)}
#cnt{font:12px var(--mono);color:var(--muted);white-space:nowrap}
@media (min-width:900px){
  #app{display:block}
  #stage{position:absolute;inset:0}
  #panel{position:absolute;left:16px;bottom:16px;width:min(560px,46vw);border:1px solid var(--line);border-radius:10px;background:rgba(22,29,46,.94)}
  #cap{max-height:13em}
}
@media (max-width:899px){
  #stage{flex:1 1 50%}
  #panel{max-height:52%}
  .lb{font-size:10.5px;padding:1px 4px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="labels"></div></div>
  <div id="panel">
    <div id="cap"></div>
    <div id="readout"></div>
    <div id="ctrl">
      <button id="bPrev" aria-label="上一步">←</button>
      <button id="bPlay" aria-label="播放/暂停">▶</button>
      <button id="bNext" aria-label="下一步">→</button>
      <div id="dots"></div>
      <span id="cnt"></span>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const SCENE='moe';
const C={bg:0x0e1320,token:0xffcf5a,hbm:0xe08a4a,compute:0x8f84ff,nv:0x45c6e8,kv:0x5fd3a0,cpu:0xc9d1e0,idle:0x4a5570,line:0x2a3550,panel:0x161d2e};
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- numbers (from code / config; see site/facts/moe.md) ----------
const MB_PER_EXPERT=5.2224;          // MB, per expert per layer per GPU, 640-padded (code)
const MB_PER_EXPERT_UNPAD=4.70016;   // 576 cols (docs)
const LAYERS=40, NEXP=384, TOPK=6;
const EXPECTED_U=NEXP*(1-Math.pow(1-TOPK/NEXP,128)); // 332.8

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick6(rng){const s=new Set();while(s.size<TOPK)s.add(Math.floor(rng()*NEXP));return [...s];}
const rngA=mulberry32(20261009);
const bs1Sel=pick6(rngA);
// bs128: sample 128 tokens × top-6 (uniform, fixed seed), record first-touch order
const rngB=mulberry32(128128);
const order=[];const seen=new Uint8Array(NEXP);
for(let t=0;t<128;t++){for(const e of pick6(rngB)){if(!seen[e]){seen[e]=1;order.push({e,t});}}}
const U128=order.length;

// ---------- Sinkhorn on a fixed random 4x4 (real algorithm, 20 iters, eps 1e-6) ----------
const sinkIters=[];
(function(){
  const r=mulberry32(7);let m=[];for(let i=0;i<4;i++){m.push([]);for(let j=0;j<4;j++)m[i].push((r()-0.5)*3.2+(i===j?1.2:0));}
  const eps=1e-6;
  // iter0 raw softmax-free exp normalised for display
  let c=m.map(row=>{const mx=Math.max(...row);return row.map(v=>Math.exp(v-mx));});
  sinkIters.push(c.map(r=>r.slice()));
  c=c.map(row=>{const s=row.reduce((a,b)=>a+b,0);return row.map(v=>v/s+eps);});
  const colN=()=>{for(let j=0;j<4;j++){let s=0;for(let i=0;i<4;i++)s+=c[i][j];for(let i=0;i<4;i++)c[i][j]/=(s+eps);}};
  const rowN=()=>{for(let i=0;i<4;i++){const s=c[i].reduce((a,b)=>a+b,0);for(let j=0;j<4;j++)c[i][j]/=(s+eps);}};
  colN();sinkIters.push(c.map(r=>r.slice()));
  for(let k=0;k<19;k++){rowN();colN();sinkIters.push(c.map(r=>r.slice()));}
})();
function sinkErr(c){let e=0;for(let i=0;i<4;i++){let rs=0,cs=0;for(let j=0;j<4;j++){rs+=c[i][j];cs+=c[j][i];}e=Math.max(e,Math.abs(rs-1),Math.abs(cs-1));}return e;}

// ---------- three setup ----------
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(C.bg,1);
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(C.bg,60,170);
const camera=new THREE.PerspectiveCamera(45,1,0.1,400);
scene.add(new THREE.HemisphereLight(0xcfd8f0,0x1a2238,0.85));
const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(20,40,25);scene.add(dl);

function mat(color,o={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:0.55,metalness:0.1},o));}
function box(w,h,d,m){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);}
const sphG=new THREE.SphereGeometry(1,18,12);

// floor grid (subtle)
const grid=new THREE.GridHelper(200,100,C.line,C.line);grid.position.y=-7.5;grid.material.transparent=true;grid.material.opacity=0.35;scene.add(grid);

// ---------- residual lanes (4 streams) ----------
const LZ=[-1.2,-0.4,0.4,1.2], LX0=-38, LX1=42;
const laneMat=mat(C.token,{emissive:C.token,emissiveIntensity:0.18,transparent:true,opacity:0.35});
const lanes=new THREE.Group();scene.add(lanes);
LZ.forEach(z=>{const b=box(LX1-LX0,0.08,0.22,laneMat);b.position.set((LX0+LX1)/2,0,z);lanes.add(b);});
// single collapsed lane segments for the attention detour
const tokMat=mat(C.token,{emissive:C.token,emissiveIntensity:0.9});
const pulses=[0,1,2,3].map(()=>{const s=new THREE.Mesh(sphG,tokMat);s.scale.setScalar(0.28);scene.add(s);return s;});
const merged=new THREE.Mesh(sphG,tokMat);merged.scale.setScalar(0.42);scene.add(merged);

// ---------- embedding table (4 slabs = 4 GPUs) ----------
const embG=new THREE.Group();embG.position.set(-41,0,0);scene.add(embG);
const hbmMat=mat(C.hbm,{transparent:true,opacity:0.28});
const hbmHot=mat(C.hbm,{emissive:C.hbm,emissiveIntensity:0.9});
const embSlabs=[];
for(let g=0;g<4;g++){const s=box(2.2,0.6,3.2,hbmMat.clone());s.position.set(0,1.2+g*0.85,0);embG.add(s);embSlabs.push(s);}
const embRow=box(2.3,0.08,3.3,hbmHot);embRow.position.set(0,1.2+0*0.85,0);embG.add(embRow);

// ---------- AR hub: 4 GPU chips + 12 directed pulses ----------
const arG=new THREE.Group();scene.add(arG);
const chipMat=mat(0x232c44,{metalness:0.3});
const chipEdge=new THREE.LineBasicMaterial({color:C.nv});
const chipPos=[[-1.7,-1.7],[1.7,-1.7],[-1.7,1.7],[1.7,1.7]];
chipPos.forEach(([x,z])=>{const c=box(1.5,0.3,1.5,chipMat);c.position.set(x,-2.6,z);arG.add(c);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry),chipEdge);e.position.copy(c.position);arG.add(e);});
const nvMat=mat(C.nv,{emissive:C.nv,emissiveIntensity:1.0});
const arPulses=[];
for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(i!==j){const s=new THREE.Mesh(sphG,nvMat);s.scale.setScalar(0.14);arG.add(s);arPulses.push({s,i,j});}
const arUp=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,2.6,8),mat(C.nv,{emissive:C.nv,emissiveIntensity:0.6,transparent:true,opacity:0.6}));arUp.position.set(0,-1.3,0);arG.add(arUp);

// ---------- mHC: Sinkhorn bar grid + pre/post bars ----------
const mhcG=new THREE.Group();mhcG.position.set(-27,0,-5.2);scene.add(mhcG);
const cMat=mat(C.compute,{emissive:C.compute,emissiveIntensity:0.25});
const bars=[];
for(let i=0;i<4;i++)for(let j=0;j<4;j++){const b=box(0.55,1,0.55,cMat);b.position.set(j*0.75-1.125,0.5,i*0.75-1.125);mhcG.add(b);bars.push(b);}
const base=box(3.3,0.06,3.3,mat(0x232c44));base.position.y=0;mhcG.add(base);
const preBars=[],postBars=[];
const preMat=mat(C.token,{emissive:C.token,emissiveIntensity:0.3}), postMat=mat(C.kv,{emissive:C.kv,emissiveIntensity:0.2});
for(let k=0;k<4;k++){const p=box(0.35,1,0.35,preMat);p.position.set(k*0.75-1.125,0.5,-2.4);mhcG.add(p);preBars.push(p);
  const q=box(0.35,1,0.35,postMat);q.position.set(2.4,0.5,k*0.75-1.125);mhcG.add(q);postBars.push(q);}
const preVals=[0.62,0.21,0.48,0.33], postVals=[1.35,0.7,1.6,0.9];
// projection beam from lanes to the stats block (20480 -> 24)
const beamMat=new THREE.LineBasicMaterial({color:C.compute,transparent:true,opacity:0.7});
function lineBetween(a,b,m){const g=new THREE.BufferGeometry().setFromPoints([a,b]);return new THREE.Line(g,m);}

// ---------- attention box (sublayer) ----------
const attnBox=box(3.2,1.6,2.2,mat(C.compute,{transparent:true,opacity:0.35,emissive:C.compute,emissiveIntensity:0.15}));
attnBox.position.set(-18,3.4,0);scene.add(attnBox);
const normRing=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.08,8,24),mat(C.cpu,{emissive:C.cpu,emissiveIntensity:0.2}));
normRing.position.set(-21,2.0,0);normRing.rotation.y=Math.PI/2;scene.add(normRing);

// ---------- Engram ----------
const engG=new THREE.Group();engG.position.set(-5,0,-8.5);scene.add(engG);
const engSlabs=[];
for(let g=0;g<4;g++){const s=box(7,1.0,2.4,hbmMat.clone());s.position.set(0,0.9+g*1.35,0);engG.add(s);engSlabs.push(s);}
const idRng=mulberry32(99);
const engIds=[];for(let k=0;k<24;k++){const g=Math.floor(idRng()*4);const x=(idRng()-0.5)*6.4;engIds.push({g,x});}
const engHits=engIds.map(({g,x})=>{const h=box(0.09,1.04,0.2,hbmHot);h.position.set(x,0.9+g*1.35,1.15);engG.add(h);return h;});
const idMat=new THREE.LineBasicMaterial({color:C.token,transparent:true,opacity:0.75});
const engBeams=engIds.map(({g,x})=>{const l=lineBetween(new THREE.Vector3(-5,0.1,0),new THREE.Vector3(-5+x,0.9+g*1.35,-8.5+1.2),idMat);scene.add(l);return l;});
const wkv=box(2.0,1.4,1.4,mat(C.compute,{transparent:true,opacity:0.5,emissive:C.compute,emissiveIntensity:0.2}));wkv.position.set(2.2,1.4,-3.4);scene.add(wkv);

// ---------- MoE: 384 experts × 4 TP slices (InstancedMesh, 1536) ----------
const EX0=3.0, EY0=0.9, SP=0.92, COLS=24, ROWS=16, EZ=-9.5;
const slabGeo=new THREE.BoxGeometry(0.165,0.74,0.6);
const expMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6,metalness:0.05,emissive:0x1a1006,emissiveIntensity:1});
const experts=new THREE.InstancedMesh(slabGeo,expMat,NEXP*4);
const dummy=new THREE.Object3D();
function expertPos(e){return new THREE.Vector3(EX0+(e%COLS)*SP,EY0+Math.floor(e/COLS)*SP,EZ);}
for(let e=0;e<NEXP;e++){const p=expertPos(e);for(let g=0;g<4;g++){dummy.position.set(p.x+(g-1.5)*0.19,p.y,p.z);dummy.updateMatrix();experts.setMatrixAt(e*4+g,dummy.matrix);}}
scene.add(experts);
const colIdle=new THREE.Color(C.idle), colHot=new THREE.Color(C.hbm), colTmp=new THREE.Color();
const expLevel=new Float32Array(NEXP); // 0..1 lit
function paintExperts(){for(let e=0;e<NEXP;e++){const v=expLevel[e];for(let g=0;g<4;g++){colTmp.copy(colIdle).lerp(colHot,v);if(v>0.01)colTmp.multiplyScalar(1+0.25*v*(g%2));experts.setColorAt(e*4+g,colTmp);}}experts.instanceColor.needsUpdate=true;}
for(let i=0;i<NEXP*4;i++)experts.setColorAt(i,colIdle);
const router=box(1.4,1.4,1.4,mat(C.compute,{emissive:C.compute,emissiveIntensity:0.35}));router.position.set(9,1.6,0);scene.add(router);
const routeMat=new THREE.LineBasicMaterial({color:C.compute,transparent:true,opacity:0.9});
const routeBeams=bs1Sel.map(e=>{const p=expertPos(e);const l=lineBetween(router.position.clone(),new THREE.Vector3(p.x,p.y,EZ+0.5),routeMat);scene.add(l);return l;});
const shared=box(2.4,2.4,1.4,mat(C.hbm,{emissive:C.hbm,emissiveIntensity:0.15,transparent:true,opacity:0.85}));shared.position.set(14,1.6,4.6);scene.add(shared);
const sharedEdge=new THREE.LineSegments(new THREE.EdgesGeometry(shared.geometry),new THREE.LineBasicMaterial({color:C.compute}));sharedEdge.position.copy(shared.position);scene.add(sharedEdge);

// ---------- 40-layer strip ----------
const layerMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6});
const layersIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1.3,0.22,3.2),layerMat,LAYERS);
for(let l=0;l<LAYERS;l++){dummy.position.set(-34+l*1.95,-5.2,0);dummy.updateMatrix();layersIM.setMatrixAt(l,dummy.matrix);layersIM.setColorAt(l,new THREE.Color(l===1||l===14?C.hbm:0x3a4560));}
scene.add(layersIM);
const layerPulse=new THREE.Mesh(sphG,nvMat);layerPulse.scale.setScalar(0.3);scene.add(layerPulse);

// ---------- final: combine -> norm -> lm_head -> gather ----------
const finG=new THREE.Group();scene.add(finG);
const lmSlabs=[];
for(let g=0;g<4;g++){const s=box(1.6,0.7,3.0,hbmMat.clone());s.position.set(46,1.0+g*0.9,0);finG.add(s);lmSlabs.push(s);}
const normRing2=normRing.clone();normRing2.position.set(42.5,0.6,0);finG.add(normRing2);
const logits=box(0.25,4.2,0.25,mat(C.token,{emissive:C.token,emissiveIntensity:0.5}));logits.position.set(50,2.4,0);finG.add(logits);
const outTok=new THREE.Mesh(sphG,tokMat);outTok.scale.setScalar(0.5);outTok.position.set(53.5,2.4,0);finG.add(outTok);

// ---------- labels ----------
const labelsEl=document.getElementById('labels');
const L={};
function lab(id,text,pos,cls){const d=document.createElement('div');d.className='lb '+(cls||'');d.textContent=text;labelsEl.appendChild(d);L[id]={el:d,pos:pos.clone?pos.clone():new THREE.Vector3(...pos),obj:null};return L[id];}
lab('emb','embed_tokens · 4×32320 行',[-41,4.9,0],'h');
lab('embAR','all-reduce 10 KiB',[-41,-3.4,0],'n');
lab('lanes','4 路残差 [1,4,5120]',[-33,0.6,1.6],'t');
lab('stats','x[20480]·hc_fnᵀ → 24 数',[-27,3.4,-5.2],'c');
lab('comb','comb 4×4 · Sinkhorn',[-27,3.7,-4.2],'c');
lab('pre','pre ×4',[-29.4,1.6,-7.6],'t');
lab('post','post ×4',[-24.4,1.9,-5.2],'k');
lab('attn','attention（另一场景）',[-18,4.6,0],'c');
lab('norm','RMSNorm',[-21,3.0,0],'m');
lab('ar','one-shot push AR',[0,-0.4,0],'n');
lab('g0','GPU0',[0,-3.1,0],'m');lab('g1','GPU1',[0,-3.1,0],'m');lab('g2','GPU2',[0,-3.1,0],'m');lab('g3','GPU3',[0,-3.1,0],'m');
lab('eng','Engram 表 · 188.8 GiB · 每卡 1/4',[-5,6.6,-8.5],'h');
lab('ids','24 个哈希行号',[-5,0.8,0.6],'t');
lab('wkv','wkv 6144→25600',[2.2,2.5,-3.4],'c');
lab('router','gate 5120→384 · top-6',[9,2.7,0],'c');
lab('experts','384 experts × 4 片（TP4）',[14,16.0,-9.5],'h');
lab('shared','shared expert · 576 列/卡',[14,3.2,4.6],'h');
lab('layers','40 层 · 每层 2 次融合 AR',[5,-4.4,0],'n');
lab('lm','lm_head · 每卡 32320 行',[46,4.7,0],'h');
lab('logits','129280 logits',[50,5.0,0],'t');
lab('fnorm','hc_combine + RMSNorm',[42.5,1.6,0],'m');
lab('L1','L1 Engram',[-32.05,-4.6,0],'h');lab('L14','L14 Engram',[-6.7,-4.6,0],'h');
const chipLabelIds=['g0','g1','g2','g3'];

// ---------- step state ----------
const tmpV=new THREE.Vector3();
let arActive=false, arAnchor=new THREE.Vector3(), arPhase=0;
function setAR(on,x,y,z){arActive=on;arG.visible=on;if(on){arG.position.set(x,y,z);arAnchor.set(x,y,z);
  chipLabelIds.forEach((id,i)=>{L[id].pos.set(x+chipPos[i][0],y-3.1,z+chipPos[i][1]);});L.ar.pos.set(x,y-0.6,z);}}
function hideAll(){
  pulses.forEach(p=>p.visible=false);merged.visible=false;
  embRow.visible=false;engHits.forEach(h=>h.visible=false);engBeams.forEach(b=>b.visible=false);
  routeBeams.forEach(b=>b.visible=false);layerPulse.visible=false;layersIM.visible=false;outTok.visible=false;
  setAR(false,0,0,0);
  expLevel.fill(0);paintExperts();
  embSlabs.forEach(s=>s.material.opacity=0.28);engSlabs.forEach(s=>s.material.opacity=0.28);lmSlabs.forEach(s=>s.material.opacity=0.28);
  shared.material.emissiveIntensity=0.15;attnBox.material.emissiveIntensity=0.15;router.material.emissiveIntensity=0.35;wkv.material.emissiveIntensity=0.2;
  setBars(sinkIters[sinkIters.length-1]);setPrePost(1);
  readout('');
}
function setBars(c){for(let i=0;i<4;i++)for(let j=0;j<4;j++){const h=Math.max(0.04,c[i][j]*3.2);const b=bars[i*4+j];b.scale.y=h;b.position.y=h/2;}}

  if(pts.size===1){goal.th-=(e.clientX-p.x)*0.006;goal.ph=clamp(goal.ph-(e.clientY-p.y)*0.006,0.15,1.55);}
  else if(pts.size===2){const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0)goal.r=clamp(goal.r*d0/d1,5,140);}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});});
const up=e=>{pts.delete(e.pointerId);};

// ---------- loop ----------
let last=performance.now(), wallT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return;}
  const dt=Math.min(0.05,(now-last)/1000);last=now;wallT+=dt;
  stepT+=dt;
  if(playing&&stepT>STEP_DUR){goTo(cur+1);}
  const s=S[cur];const tt=reduced?99:stepT;
  if(s.up)s.up(tt);
  // AR pulses
  if(arActive){arPhase=reduced?0.5:(wallT*0.9)%1;for(const q of arPulses){const a=chipPos[q.i],b=chipPos[q.j];const p=ease(arPhase);
      q.s.position.set(a[0]+(b[0]-a[0])*p,-2.2+Math.sin(p*Math.PI)*1.2,a[1]+(b[1]-a[1])*p);}}
  // camera
  if(autoRot)goal.th+=dt*0.04*Math.sin(wallT*0.25);
  const k=1-Math.pow(0.0025,dt);
  cam.t.lerp(goal.t,k);cam.r+=(goal.r-cam.r)*k;cam.th+=(goal.th-cam.th)*k;cam.ph+=(goal.ph-cam.ph)*k;
  camera.position.set(cam.t.x+cam.r*Math.sin(cam.ph)*Math.sin(cam.th),cam.t.y+cam.r*Math.cos(cam.ph),cam.t.z+cam.r*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.t);
  renderer.render(scene,camera);
  // labels
  const W=stage.clientWidth,H=stage.clientHeight;
  for(const id in L){const o=L[id];if(!o.on){o.el.style.opacity=0;continue;}
    tmpV.copy(o.pos).project(camera);
    if(tmpV.z>1||tmpV.z<-1||Math.abs(tmpV.x)>1.1||Math.abs(tmpV.y)>1.1){o.el.style.opacity=0;continue;}
    o.el.style.opacity=1;o.el.style.transform='translate('+((tmpV.x*0.5+0.5)*W).toFixed(1)+'px,'+((-tmpV.y*0.5+0.5)*H).toFixed(1)+'px) translate(-50%,-100%)';}
}
goTo(0);setPlay(playing);
// snap camera to first goal
cam.t.copy(goal.t);cam.r=goal.r;cam.th=goal.th;cam.ph=goal.ph;
requestAnimationFrame(frame);
})();
</script>
